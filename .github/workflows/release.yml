# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## Play it with a controller

          The whole app is now navigable from a gamepad, so it works from the
          sofa or on a Steam Deck.

          - The left stick moves the highlight, the bottom face button presses
            it, and the right one goes back. The shoulder buttons step along
            the header, the triggers switch between Search and Library, and
            Share/Options open the download list and the downloads panel.
          - The top face button is a right-click, so the library's game menu -
            set cover, open folder, delete - is reachable without a mouse.
          - An on-screen keyboard for searching without reaching for one.
          - A legend across the header shows what every button does, labelled
            for the controller you actually plugged in: Cross/Circle/Square/
            Triangle for PlayStation, A/B/X/Y for Xbox, and Nintendo's mirrored
            layout for a Switch Pro pad.
          - It gets out of the way the moment you touch the mouse or keyboard,
            and comes back when you pick the pad up again.

          ## New

          - Search results now say **In Library** on files you already have.
            Click it and the library opens on that game, highlighted.
          - A search box in the library, matching words in any order across
            titles and consoles.
          - **Select all** in the library, covering every console at once, and
            **Remove all** on the right-click menu when several games are
            selected.
          - The logo and the app name are both ways back to the search.

          ## Fixed

          - Closing a maximised Downloads or Download-list panel left an
            invisible full-window layer over the page that swallowed every
            click. This is the big one.
          - Signing out of archive.org while login-only files were downloading
            left them running against a dead session, and resuming afterwards
            failed with an error that explained nothing. They are now paused as
            you sign out, keep everything already downloaded, and resume from
            where they stopped once you are signed back in.
          - When something needs an archive.org account, you can sign in from
            the message itself instead of hunting for the header button and
            starting over - and whatever you were doing carries on.
          - Scrollbars everywhere now match the theme instead of showing a
            bright stripe down the edge of every list.
          - Clicking away closes the update box, and clicking the header closes
            a maximised panel.
          - The RetroAchievements filter no longer paints a coloured panel
            behind its logo when it is on.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit
          distributions - Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+,
          Arch - and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or
          minimal systems may not have what it expects.

          Controller support was checked against the way Linux reports pads,
          which differs from Windows: d-pads that arrive as an axis instead of
          buttons now work, and controllers are still identified correctly when
          the browser names them differently.
          EOF
