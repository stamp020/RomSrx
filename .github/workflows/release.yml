# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## 🏆 Your RetroAchievements profile, in the app

          **Who you are, in the corner of the header.** Your picture, your points and RetroPoints, and what you are playing right now with that set's icon beside it.
          <sub>Refreshed on a quiet timer, so an app left open all evening does not still claim you are playing the thing you finished at six. Absent entirely until you fill in a username — nothing changes for anyone who only wanted box art.</sub>

          **Press it for the whole profile,** in a panel over the app or a window beside it.
          <sub>Your standing, what you have been playing, what you have won and the people you follow. The panel and the window are the same page, so they can never disagree; the button in its title bar moves it out to a window of its own.</sub>

          **Twelve figures their site works out rather than stores.** Points, RetroPoints, rank and mastered up top; then achievements unlocked, games beaten, what share of the games you started you finished, average completion, RetroRatio, points in the last 7 and 30 days, and points a week since you joined.

          **Awards in three tabs — Mastered, Beaten, Events & site.** Drag any of them to arrange the wall, with a Reset that puts a tab back the way the site sends it.
          <sub>"Icons only" drops the names for a trophy case of pure badges. Mastered games are edged in your chosen colour wherever they appear, including among the beaten ones. A toggle on Beaten hides the games you went on to master, since every mastery earns a beaten award too.</sub>

          **Last played opens out into the whole set.** Every achievement as a badge — earned in colour, still locked in the site's own greyed artwork — and a button at the end that opens this app's own list for that game.

          **The people you follow, ranked by points,** each with their picture, both point totals, their rank, and the game they are in with its icon and the hours they have put into it.
          <sub>Open a row for more: their RetroRatio, when they joined, their motto, and the last six games they played with how far through each they are.</sub>

          **Everything in it is a link.** A game opens its page, a person opens their profile, an award opens the game it was won in. Right-clicking anything with a game behind it offers its page, its supported files, and this app's own achievement list.

          **Arrange the page itself.** Last played, Awards and People you follow can be moved into whatever order you read them in, and it is remembered.

          ## 🎖️ Every achievement in a set, in the app

          **A list behind a button, wherever a game is described.** How Long / Achievements, the preview panel, and a window of its own beside a running game.
          <sub>Badges, descriptions, points and RetroPoints, and how rare each one is. Filter to what is still locked, what you have, the missable ones or the progression ones; order by the set's own order, by points, or rarest first.</sub>

          **Open the list automatically when a game starts.** Settings → Library: nothing, this app's list, or the game's page on RetroAchievements. Off by default.

          **What people said about each one.** An arrow on any achievement opens its comment thread — where the practical knowledge is, and often the only warning that a trigger is fussy.
          <sub>The site's own bookkeeping posts are kept but drawn quieter, so advice and history are told apart at a glance.</sub>

          ## ✨ What to play next, and what to play after that

          **Asked of whichever shelf you are on.** On a playlist that includes the games you have not downloaded yet — not owning it is one click of difference, not a reason to leave it out.
          <sub>Covers on every row, both medians in your accent colour, and an order-by for shortest to beat or shortest to master. A row plays the game, fetches it, or opens its preview, depending on what it is.</sub>

          **"Include games you have played"** turns the window into "how long is everything here", for a shelf where you have started everything.

          **Games you might like.** A new star button on the library bar reads your shelf — what you own, and what you have actually played — and suggests games of that kind.
          <sub>Suggestions come from IGDB's own "similar games", narrowed to what this app can download, with the ones RetroAchievements has a set for first. Without IGDB it offers more of the series you already own. Ten at a time, with box art, both medians, a console filter, an achievements-only tick and a Find more button. The cover opens the preview; the row searches for it.</sub>

          ## 🕹️ The library

          **Which copies of a game a set was actually built from.** A RetroAchievements button on any search result marks the downloads that are the dumps its set accepts.
          <sub>Per console, so a Sonic card spanning three systems is checked against three different sets. Matched by name against the files RetroAchievements publishes — the note says so, since only the file's own hash is certain. Press it again to clear the marks.</sub>

          **Sort by how much of each set you have earned,** with a "Hide mastered" tick for a shelf about what is left to do.

          **Show how long a game takes on every cover** — to beat, to master, or both — whatever the shelf is sorted by.

          **Choose what clicking a cover does:** play the game, or open its preview. In preview mode a play button appears on every cover and in every list row.

          **The figures on a cover are readable now** and take a third of the space they did: one quiet wash behind all three, hours played, time to beat and achievements earned, with the buttons moved to the middle of the artwork and shown only on hover.

          ## ⚙️ Settings and consoles

          **A Library group, and a tab for it.** How the shelf behaves, reachable from the library's own gear and from the main settings.

          **Pick a console by its name, not its tick box,** in the every-console window.

          **"Select RetroArch consoles"** ticks all thirty of them in one press — leaving out Sony's machines, the GameCube and the Wii, whose own emulators are better — so one emulator path and one Get cores does the lot.

          **A core for the Nintendo 3DS.** Azahar, the maintained successor to the Citra core.

          ## Fixed

          - **Backup choices were forgotten every time the app closed.** They are saved the moment a box is ticked now. The same bug was found and fixed in the library's Hide mastered switch.
          - **Text could not be selected on RetroAchievements pages** opened in the app's own window. It could not be selected anywhere, in fact — the window was created with selection switched off.
          - **Dragging across a screenshot swept a text selection** over the counter and the buttons floating on it.
          - **Collapsing one console reloaded every other console's covers.** Only the console you touched is touched now, and covers remember the address that worked, so no redraw walks the same list of misses again.
          - **Deleting one game redrew the whole shelf,** reloading art for games nothing had happened to.
          - **A new dropdown on the library bar was white** while everything around it was not.
          - **The Atari Jaguar CD said "use its own emulator"** without saying which. It now names BigPEmu and explains that no libretro core runs the CD unit.
          - **Achievements were silently dropped** for every set: the field carrying an achievement's id is spelled in full capitals, and the case-folding missed it.
          - **"Games beaten" counted mastered games twice,** reporting 69 games beaten out of 36 started.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit distributions — Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+, Arch — and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or minimal systems may not have what it expects.

          Controller support accounts for the way Linux reports pads, which differs from Windows: a d-pad that arrives as an axis rather than buttons, a DualShock/DualSense whose raw button order starts at Square, and a controller that never announces itself to a page that was already open.
          EOF
