# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The frontend is thirteen thousand lines of JavaScript that nothing
      # else compiles. A syntax error in it builds perfectly cleanly and ships
      # an app that opens to a blank window, because the only check anywhere
      # was that app.js exists. Node is on both runners already.
      - name: Check the frontend parses
        run: |
          for f in web/*.js; do node --check "$f"; done
        shell: bash

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Kept in step with upload-artifact above: the two majors are a matched
      # pair, and a download that does not understand what the upload wrote
      # fails at the last step of a release, with the build already paid for.
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## 🎖️ The sets built on a game, as the site shows them

          **A row of icons above the list, not a dropdown.** RetroAchievements calls them subsets and gives each its own id and its own page, so a window showing one had no way to reach the others — which is exactly the moment somebody wants them, having just finished the main set with the game still running beside them.

          Pictures rather than a list of names, because that is how these are held in mind: a subset's icon is usually a variation on the game's, and picking the one with the star off a row is a glance where reading four near-identical names is a task. Underneath sits the site's own line — `True Skill — 9 achievements worth 750 points (32,637 · ×43.52)`.
          <sub>The RetroPoints are summed rather than read: no endpoint publishes a set's total, so they are what its achievements add up to, which is the same arithmetic the site does. That fetch also supplies the icon, is cached, and runs after the list has painted so it never delays what you came for.</sub>

          ## 🖼️ Who wrote the hint

          **A face against every comment, and a click through to them.** A hint is only as good as who is giving it, and "is this person forty thousand points in, or is this their first week" was a name to go and type into the site by hand.

          **And the links in them work.** A comment is often a video of the trick or a thread arguing about a trigger, and those arrived as plain text nobody could follow without retyping. Left click opens them in your own browser — the achievements window has no address bar and no back button, so following a link *into* it would be a dead end.
          <sub>Escaped first and linked second, never the other way round: the text is written by strangers, and building HTML out of it before escaping is how somebody's comment becomes somebody's script.</sub>

          ## 🔍 One slider, everything on the row

          **Bigger or smaller, comments included.** This window is opened beside a game — often on a second screen, or a television, or across a desk — and the size that suits a laptop three feet away suits none of those.

          It was scaling the popped-out window and nothing else, and inside that it was leaving the comments alone. Both are fixed: the badge, the name, the description, the rarity, the avatars and the comment text now move together, everywhere the list appears.
          <sub>The comments needed the rules moved as well as rewritten. `.achsaid.bot .achsaidtext` is three classes deep and was quietly outranking the scaled rule, which left the site's own bookkeeping rows stubbornly 11.5px while everything around them grew.</sub>

          **And the comments panel can be dragged taller or shorter.** A thread is two lines or two hundred, and which it is only becomes clear once it is open.

          ## 🪟 The same list, wherever you opened it from

          **Everything above now works in all four places** — the preview panel, the How Long window, the achievements dialog, and the window that opens beside a game. They share one block; the slider, the subsets and the avatars were only ever wired into the last of them.

          **A pop-out button on the block itself.** The preview panel never had one, and the other two carried their own copy of the same handler. Three buttons became one.

          **A window opened beside a game closes with it.** Opening an achievement list automatically is a convenience; leaving it on screen afterwards makes it one more thing to tidy up, which is the opposite. Only windows the app opened on the way in — a page you went and found yourself is yours.

          ## 💾 Finding one evening again

          **A note on any session.** Fifteen days of "21:07 · 3 files" says when you played and nothing about what happened. Now: *before the point of no return*. It is a plain field in the row, saved when it loses focus or on Enter — writing one should cost less than deciding to.

          **And the game it was**, when the app is what started it. A memory card does not record what wrote it, so the only moment this can be known is the launch — it is written down then. Games started outside the app show no name, and the row reads as it did before.
          <sub>Deliberately silent when two emulators wrote during the same window: the app started one game, and labelling both would be right about one and a lie about the other.</sub>

          **One console out of a RetroArch evening.** RetroArch files its saves under the core, so one session's folder holds every console played that night — and restoring it put back a Nintendo 64 save nobody asked about. Each console can now go back on its own, named for what it plays rather than what the folder is called: `Gambatte — Game Boy · Game Boy Color`.

          **A filter and a search over the lot.** Emulators at the top, and under RetroArch its consoles, built from what is actually kept so it never offers one with nothing behind it. The search box matches on the game and the note.
          <sub>Notes and game names live *beside* the snapshot, not in it. Inside, each would be an ordinary file in the folder — counted in the total, offered as something to restore, and copied into your saves the moment you pressed the button.</sub>

          ## 🔑 Signing the emulators in

          **Sign in to one emulator and the app copies that login to the others.** You are never asked for a RetroAchievements password and none is stored: the token is the *account's*, not one emulator's, so the one already on this machine is the one the rest will accept.

          It reports what it cannot do rather than appearing to work. Checking real config files turned up that **PCSX2 and PPSSPP no longer keep the token in their settings file at all** — both write only the username, because the token now lives in Windows Credential Manager, which is the right place for it and is not a text file anything can edit. Those are listed as needing signing in there. RetroArch and DuckStation still hold both and are filled in.
          <sub>It never invents a config file, never writes into one whose expected section is missing, never touches a password field, and never modifies the emulator it read from. 46 tests, most of them about what it leaves alone.</sub>

          ## 🐛 Fixes

          - **The Mastered and Beaten bars vanished under the ranked filters.** The bar under a cover is drawn from progress the page fetches separately, and the ranked lists — "quickest to beat" and the rest — never asked for it. Searching "spyro the dragon" plainly showed one Mastered bar and the same games ranked showed none.
          - **A malformed request made the restore planner walk the app's own install folder.** A blank path becomes `Path("")`, which is `Path(".")`, which *is* a directory. Since that path arrives from the page and everything after it is "copy this into the emulators' save folders", it now has to resolve to exactly three levels inside the save history — which also stops a day folder being handed in, where every session that day would have gone back on top of each other.
          - **A memory card listed as a console.** PCSX2 can keep a card as a *folder* rather than a file, and the rule "the folder under the kind is the console" duly offered `Mcd001_converted.ps2` in the console picker. Only RetroArch sorts its saves by core; everywhere else the whole session is the only unit. Found on a real machine rather than imagined, and it is a test now.
          EOF
