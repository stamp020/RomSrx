# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The frontend is thirteen thousand lines of JavaScript that nothing
      # else compiles. A syntax error in it builds perfectly cleanly and ships
      # an app that opens to a blank window, because the only check anywhere
      # was that app.js exists. Node is on both runners already.
      - name: Check the frontend parses
        run: |
          for f in web/*.js; do node --check "$f"; done
        shell: bash

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Kept in step with upload-artifact above: the two majors are a matched
      # pair, and a download that does not understand what the upload wrote
      # fails at the last step of a release, with the build already paid for.
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## ☁️ Two computers, properly this time

          **Sync went in last version. This is the half that was missing.**

          - **Keeping in step actually happens on its own now.** Make a playlist and walk away and it goes; the other machine looks every few minutes, so it is already there when you sit down. Before, nothing left until you closed a game or restarted.
          - **Bring from the cloud.** Pick what you want and take it — the playlists and nothing else, whenever you like. Sync merges and decides; this does what it is told.
          - **Take it from one particular computer.** Every machine also leaves a copy of its own that nothing merges, so the laptop's memory cards are still reachable from the desktop. No machine's version is lost to another's any more.
          - **Name your computers.** They were showing up as `DESKTOP-8H2K1LM`. Renaming is safe at any time.

          ## 🧭 Settings that explain themselves

          Three different things all sat under headings that read as "backup", in an order that told no story. They are named up front now — what runs by itself, what runs when you ask — and setting up a sync is three numbered steps instead of seven identical rows.

          ## 🐛 Fixes

          Every one of these was found by running two computers against each other rather than by reading the code.

          - **A second computer could wipe the first one's playlists.** On its very first sync it had no history to compare against, so its own empty defaults counted as "newer" and went up over everything. The first machine then pulled the emptiness back. A machine joining a set now takes what the others already agreed, keeping its own copy beside it.
          - **Syncing your settings deleted this machine's games folder.** Preferences travel between computers and paths must not, so what goes up has the paths stripped out — and writing that back over the local file removed the ones already there. `folder` and `emulators` came back empty. They are merged now, the same way restoring a backup does it.
          - **The second computer took the first one's identity.** Its name, its id and its cloud folder path all travelled, so both machines then reported themselves as the same one and no save could say which it came off. Nothing whose name begins with `sync` leaves the machine it was set on any more — the WebDAV password included.
          - **A WebDAV sync never settled.** A server answers with an etag, not a hash of the contents, so every file looked changed on the far side on every run and the whole selection came down again, for ever.
          - **Every pull was followed by a pointless upload** of what had just been fetched.
          - **Changing the sync folder left the new one half empty** — the app still believed the files it had sent to the old one were already there.
          - **RetroAchievements settings showed before the index was built**, where only the backup section is meant to appear.
          EOF
