# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## New

          - **The front page opens on consoles.** Forty thousand games in one alphabetical list is a scroll bar, not a starting point. Pick a console and its games appear, A-Z; "All consoles" is still there for anyone who would rather browse the lot.
          - **Continue playing.** A row at the top of the library with the games you last opened, newest first, that scrolls sideways through the whole history rather than stopping at a handful. On a playlist it shows only what you played *on that playlist*, and vanishes entirely when that is nothing. Games opened straight from an emulator are noticed too, not just ones launched from here.
          - **It tells you when a download finishes** — in the app, and as a desktop notification when the window is not the one you are looking at. There is a switch for it under Settings → Downloads.
          - **Backup and restore.** Saves your settings, download list, playlists, recently played and hand-picked covers to a zip you can carry to another machine. Your games and the search index are deliberately left out: both are large and both rebuild themselves.
          - **Covers can fetch themselves.** A switch under each console's cover folder: box art is downloaded as each game for that console lands. Games the thumbnail server has never heard of quietly get nothing.
          - **Unpacking has a progress bar.** A 2 GB archive used to sit at 100% for minutes with nothing moving, which reads as a hang. Extraction now has a bar of its own, in a different colour so it is plainly a second stage rather than the first going backwards.
          - **Settings has tabs**, and the per-console paths are a console picker with a search box rather than a table of thirty-six rows to scroll through.

          ## Fixed

          - **"Unsorted" was most of the library, full of things that are not games.** Two separate faults. A folder holding ROMs was treated as one game, so `NES Jogos` with a hundred games inside it became a single entry called "NES Jogos" and the games themselves were never listed. And an emulator installed in the download folder contributed its firmware, shader caches and Dolphin's `IPL.bin` as games, because `.bin` is also what a PlayStation track is. Folders are now judged on whether their contents add up to one game, an emulator's own folders are skipped by name, and the folder holding a program you picked in Settings is left alone entirely.
          - **Games with no console folder now find their console.** Sitting loose in the main folder was the only reason a game was "Unsorted", and nothing about a folder can fix that. The index already knows what machine a game is for, so it is asked - by name, narrowed by what the extension means, and narrowed again by how the set is served. A name that is genuinely on six consoles inside a `.zip` stays unsorted, because a wrong console is worse than none.
          - **PlayStation games appeared two or three times over.** A disc rip is a `.cue` naming one or more `.bin` tracks, and each file was judged on its own. Files in a folder are now read together, and Play opens the `.cue` rather than a track that would boot to a black screen.
          - The **×** that removes one download had a button around it, which made the most destructive control on the row look like its main one. It is a plain mark now.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit distributions — Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+, Arch — and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or minimal systems may not have what it expects.

          Controller support accounts for the way Linux reports pads, which differs from Windows: a d-pad that arrives as an axis rather than buttons, a DualShock/DualSense whose raw button order starts at Square, and a controller that never announces itself to a page that was already open.
          EOF
