# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## ✅ Does this copy actually earn achievements?

          **A set is not attached to a title — it is attached to particular dumps, and RetroAchievements knows them by a hash.** The app now works out that same number from the file on your disk and compares it against the set's own list, so the answer is certain rather than a good guess.
          <sub>The rules are ported from rcheevos, the code the site itself runs: headers skipped for NES, FDS, SNES, PC Engine, Atari 7800 and Lynx, a Nintendo 64 ROM normalised to big-endian, and a DS card hashed from its header, boot code and icon block alone. Zips, folders and .7z are looked inside; anything holding two ROMs is reported as unclear rather than guessed at.</sub>

          **PlayStation and PlayStation 2 discs are opened too.** A disc's number comes from the program the disc boots, so the image is walked as a filesystem and hashed from the executable named in SYSTEM.CNF — .iso and raw .bin, including one named by a .cue or sitting alone in a folder.
          <sub>.chd and .rvz are compressed formats this app does not decode, and GameCube, Wii, Dreamcast, Saturn, Sega CD and PSP each have a rule of their own that is not implemented. All of those say "not checked", never "this copy failed".</sub>

          **A tick or a cross on every game, and a shelf that can be narrowed to the copies that will not earn anything.** Settings → Library checks the lot; the same check is on a game's right-click menu and in its preview panel. The marks can be switched off entirely.

          **When a copy does fail, the app looks for one that works.** The set names the dumps it was built from and your index is a list of files, so the copy that would have worked is usually one press away.
          <sub>Matched on the dump's name with nothing loosened — region, revision and disc all still have to agree — and dumps that are themselves a patch are never offered as a download.</sub>

          **Answers are kept.** The marks are back on the shelf next time you open the app without checking anything again, a game stored as a folder is keyed on what is inside it, and any copy that has changed since it was checked quietly drops its answer rather than showing you a stale one. A finished download is checked the moment it lands.

          ## 🔍 Search knows which copies work, without being asked

          **Every result on the page is checked in the background now.** The mark used to exist only for cards you had pressed the button on, which is backwards — the value of it is spotting the copy you would not have thought to check.

          **Copies from RetroAchievements' own collections are recognised.** Sixty-three of the indexed sources are the site's own sets, and a file from one is an accepted dump whatever its name went through on the way into an archive listing. It gets a mark of its own, because "this is the dump the set was built from" and "this came out of their set" are both good answers and not the same answer.

          **Order a search by fewest achievements.** The one thing about every game that can be had in bulk — a whole console in a single request — so it sorts on the spot where a time cannot. Per console, because a set is per console: Spider-Man 2 is 184 achievements on the PlayStation 2 and 57 on the GameCube.
          <sub>The count rides on every card whatever the order is, so you can narrow by set size and then order by time to beat and read both at once.</sub>

          ## 🎯 Your Want to Play list, in the app

          **The list you keep on retroachievements.org, matched against your index.** Each game says what can be done about it: already on your shelf, ready to download, a hack that needs the patcher, or nothing your sources carry. Fetch one, add them all to the download list, or take the lot.
          <sub>Their titles and a preservation set's rarely agree — they write *The Legend of Spyro*, No-Intro writes *Legend of Spyro, The*. Both sides are folded the same way; on a real list of 78 that matched 70. Demos and prototypes sort below finished releases, since nothing here is chosen by hand.</sub>

          **Games it cannot fetch get a Search button** that opens the search with the name typed and the console already narrowed.

          ## ⏱️ Hours, sets and setup

          **Play time comes from RetroAchievements first.** Most emulators keep no runtime log at all, so games played in Dolphin or PPSSPP showed nothing and counted as "never started". The site has been counting the whole time; the emulator's own log fills in behind it.

          **Will this session count?** Settings reads RetroArch's own configuration and says so when achievements are off, hardcore is off, nobody is signed in, or the account is not the one configured here. Read and never written, and the login token in the same file is never touched.

          **Find my emulators.** One press looks where installers put things and points each console at what it finds — PCSX2, DuckStation, Dolphin, PPSSPP, RetroArch. A console already pointed at something is left alone unless you say otherwise.

          **A set is kept between sessions,** so the achievement list still works with no connection — and the app notices when a set has been revised since you last looked, which is how a mastery can quietly stop being one.

          **Sort the shelf by "closest to mastering"** — how few are left rather than how many are done, which is the question you actually act on.

          ## ✨ Smaller things

          - **Choose which tab the app opens on**, the search or your library.
          - **A narrow window keeps the logo and drops the name, the version and the index figures**, so the controls have the room.
          - **Recommendations show console badges, can be dealt again, and say how far through the list you are.** Narrowed to one console they used to run out at seven; everything with a set on that console now fills in behind them, with a line saying where the app's own reasoning stops.
          - **"What to play next" really does show every game** when asked to — it used to drop everything RetroAchievements had no time for.
          - **The whole app speaks Portuguese again:** 56 new strings.

          ## 🐛 Fixes

          - **Patches published as a .7z would not open.** py7zr removed the call the app used, which broke 257 of the 4,748 games that have patches.
          - **Search showed one mark where a card had fourteen.** Answers were keyed on the filename alone, and one card holds the same name many times over: "Spider-Man 2 (USA).zip" is a GameCube, a Nintendo DS, a PSP *and* a PlayStation 2 file, and three separate PlayStation 2 copies from three sources.
          - **Every dump in every set read as having no hash at all.** The site spells the field `MD5`; the app asked for `md5`.
          - **"Beaten in 10 h 40 min" was not how long it took** — it was the total that person had ever spent in the game. RetroAchievements publishes no per-person time-to-award anywhere, so the award is stated plainly now and the hours sit beside the title as what they are.
          - **The daily and weekly rankings listed people who had not played,** pushing the two or three who had off the bottom of the panel. They are counted instead.
          - **Pages on RetroAchievements ignored your "open in" setting** — in the profile window, and in the page that appears when a game starts.
          - **The navigation bar in the built-in browser wandered when the window was resized.** It is kept as a fraction of the room now, so the middle stays the middle.
          - **Two preferences were silently forgotten on restart,** the "won't earn achievements" filter among them, because the server only stores settings it has been told about.
          - **A burst of requests got part of itself refused.** Everything the app asks RetroAchievements now queues behind one gate, and a "slow down" is retried once.
          - **The Want to Play list, the recommendations and the profile ranking are all faster** — a folded title map that was rebuilt on every open is now kept, and the library sweep hashes four files at a time.
          EOF
