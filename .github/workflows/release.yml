# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## New

          - The version number now sits beside the app name. Click it to read the notes for the version you are actually running.
          - Reindexing says how much longer it has to go, rather than just counting sources.
          - Downloads from a login-only source now carry the 🔒 tag in the downloads panel too, not only in search.

          ## Faster

          - Reindexing fetches from archive.org eight at a time instead of four, and the database no longer waits on the disk after every single source. Both are wall-clock time you were spending on nothing.

          ## Changed

          - **In Library** now marks a whole console at once, centred above that console's list of sources, instead of pointing at one file. Once a `.zip` has been extracted there is no honest way to tell which download produced the folder on disk — but "you have this game, on this console" is a question that can always be answered.
          - The library re-reads your folders whenever you open it, so games you added or deleted outside the app appear without pressing Refresh. What is already on screen stays there while it looks.
          - The on-screen keyboard now belongs to the controller: it goes away the moment you touch the mouse or keyboard, and comes back on the same field, with your typing intact, when you pick the pad up again.

          ## Fixed

          - **"Pause all" started downloads instead of stopping them.** Pausing a transfer frees its slot, and a waiting download immediately claimed it — so the button visibly began the very things it was meant to stop. Everything now stops together. Resuming puts the transfers that were mid-flight back at the front, so they carry on from their part-files instead of being overtaken by files that had never started.
          - "Pause all" could stay on screen after being pressed and do nothing when pressed again, if a download had stalled rather than stopped cleanly.
          - A controller drove the app while it was in the background. Playing something else with the pad moved the highlight around behind the window; a resting stick could scroll the page on its own.
          - Release notes opened scrolled to the bottom instead of the top.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit distributions — Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+, Arch — and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or minimal systems may not have what it expects.

          Controller support has had more work for the way Linux reports pads, which differs from Windows in three ways that each broke it on their own: a d-pad arriving as an axis rather than buttons, a DualShock/DualSense whose raw button order starts at Square, and a controller that never announces itself to a page that was already open.
          EOF
