# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The frontend is thirteen thousand lines of JavaScript that nothing
      # else compiles. A syntax error in it builds perfectly cleanly and ships
      # an app that opens to a blank window, because the only check anywhere
      # was that app.js exists. Node is on both runners already.
      - name: Check the frontend parses
        run: |
          for f in web/*.js; do node --check "$f"; done
        shell: bash

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Kept in step with upload-artifact above: the two majors are a matched
      # pair, and a download that does not understand what the upload wrote
      # fails at the last step of a release, with the build already paid for.
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## 🏅 Matching, and 101 more sets

          **Nine tenths of RetroAchievements, and the last of the near misses.** Somebody reported that SpongeBob SquarePants: The Movie has a set and the app said it did not. It does, and finding out why turned up four separate ways the same game gets written down differently by two catalogues. Rather than fix the one, every set the index plainly has and was not matching got listed, and the reasons read off them:

          **The article, wherever it sits.** No-Intro writes `Movie, The` and that was already handled; an article in the middle was not, nor was one hiding behind a publisher. `The SpongeBob SquarePants Movie` now meets both `SpongeBob SquarePants - The Movie` and `Nickelodeon The SpongeBob SquarePants Movie`.

          **A title carrying its other name.** RetroAchievements writes both of a game's names either side of a bar — `Druaga no Tou | The Tower of Druaga` — and **97 sets** are written that way. Each side is now tried in full rather than the pair being folded into one string that answered to neither.

          **Underscores are spaces**, for the dumps named `sonic_adventure_tournament_disk`.

          **And the subtitle written first.** `Golgo 13: The Mafat Conspiracy` against `Mafat Conspiracy - Golgo 13`, Japanese names either way round. Sorting the words joins those — and, done naively, joins things that must never be joined: measured across six consoles it merged `Euro Demo 01 02` with `Euro Demo 02 01`, which are different discs whose whole identity is the order of two numbers. So the words sort and the numbers do not.
          <sub>Near misses went from 25 to 3, and the three left are genuinely ambiguous. A quieter bug went with them: the spelling-to-game map was filled in file order, so one game's loose spelling could claim a key another game answered to exactly.</sub>

          ## 🏆 Only the games with achievements

          **A trophy in the filter bar.** One press and the search is narrowed to games RetroAchievements has a set for — `spongebob` from 94 games to 22, `mario` from 591 to 111.

          Filtered by the database rather than by hiding cards, so the count over the list and the numbers inside the dropdowns are counts of what you are actually looking at. Hiding them afterwards would have left "94 games" written over a list of 22, and a console dropdown offering numbers that vanish when you click them.

          **And it counts both things**, because they are far apart and only one of them is obvious: `111 games · 741 sets`. The same Super Mario World cartridge answers for **299** sets, since every hack of it is patched onto that one file. Shown only the games, anybody would reasonably ask where the rest went.
          <sub>Not the same question as the RA logo beside it, which is about where a *copy* came from rather than whether the game has achievements at all.</sub>

          ## 💾 Going back to an evening

          **Every session's saves, kept for a fortnight.** Close a game and whatever it wrote is copied aside, filed under the emulator, then the day, then the time you stopped:

              PCSX2/2026-08-21/21-07/memcards/Mcd001.ps2

          A scheduled backup already answers "my memory card is corrupt". This answers the other one — *I want last Tuesday back* — which a schedule cannot, because it snapshots at a time unrelated to when anybody was playing.

          **Fifteen days per emulator, and no limit within a day.** Play six times on a Saturday and all six are there; the fortnight is counted per machine, so a lot of PS2 cannot shorten the history of a Mega Drive nobody has touched. Only what that session actually changed is copied — a session that wrote one memory card copies one memory card, not the hundreds of megabytes a full RetroArch folder holds.

          **Settings → Browse sessions, and one button puts a moment back.** Two presses rather than one: the first says exactly which files it would replace, the second does it. This is the only thing in the app that writes over something you cannot get again from anywhere.
          <sub>Guarded twice. It refuses while the game is open, because the emulator writes its save out on the way and would silently undo the restore. And it snapshots what is there first, so picking the wrong evening is a thing you can walk back.</sub>

          ## 🐌 archive.org, when archive.org is having a bad day

          **A download that collapses is dropped and reopened.** The same file asked for four times in a minute came back at 543, 35, 22 and 543 KB/s depending which of their nodes answered. At the slow end a 2 GB disc is twenty hours, and the app sat through it, because a transfer that is moving is not a transfer that has failed.

          Measured against what that download has itself already managed, never against a number chosen in advance: if it did 500 KB/s and drops to 50 that is a bad server, and if it never exceeded 30 KB/s that is your line and it is left alone. A reconnection does not spend a retry either — five of those and a download would die for going too well.
          <sub>The slowness itself is theirs, and this was checked before blaming anything: plain HTTP with the app not involved got the same 24–55 KB/s off the same file, and one PS2 item returned HTTP 500 six times out of six.</sub>

          ## ⚡ Two things that were quietly slow

          **Typing.** One letter matched 54,142 games and took **3.1 seconds**, most of it counting them up per console and per region for the filter bar — and one letter is a state every search passes through on the way to being typed. So the most expensive question the app can ask was being asked on the way to almost every cheap one, and the answer thrown away. A single letter now waits long enough to be meant. Two letters have always taken 30ms.

          **Every 256 KB that arrived** opened the settings file and parsed it as JSON, to ask about a speed limit that is almost always "none". Cached now, and invalidated the moment the setting is written, which took local throughput from 156–268 MB/s to 240–368.

          ## 🖱️ Smaller things

          - **A download row can say where it came from.** A twisty by the filename opens `SOURCE  Redump PS2 (B)` — folded away because it is the longest string on the row and the answer to a question most people are not asking while they watch a progress bar. It stays open across the redraw, which used to fold it back up every two seconds.

          ## 🐛 Fixes

          - **A finished torrent could be handed over before it was on the disk.** `file_progress` counts the bytes that have arrived and libtorrent buffers before writing them, so the file was moved into place while its tail was still in memory. On a fast machine the write always won that race; on a slower one what got moved was short, and reported as a finished download.
          - **Throwing away a half-finished torrent left the half behind.** A collection torrent writes into a folder of its own and only the finished file is moved out, so the bytes sat somewhere nothing looked at and nothing ever cleaned up. For a disc image that is gigabytes.
          - **The release script wrote a byte-order mark into `__init__.py`.** Windows PowerShell 5.1 reads `-Encoding utf8` as "UTF-8 with a BOM"; only PowerShell 7 made it BOM-less. Python's parser rejects it outright, so v3.5 was tagged and pushed and only then failed to build. The tests now run before anything is written, committed, tagged or pushed.
          - **A red build said "exit code 1" and nothing else** to anyone not looking at it in a signed-in browser tab. Failures are reported as annotations now, which are readable without any of that.
          - **The reindex dialog said "Reindexing from archive.org"**, which stopped being true when 133 MiNERVA shelves arrived.
          EOF
