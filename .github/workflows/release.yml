# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## New

          - **The front page opens on consoles.** Forty thousand games in one alphabetical list is a scroll bar, not a starting point. Pick a console and its games appear, A-Z; "All consoles" is still there for anyone who would rather browse the lot.
          - **Continue playing.** A row at the top of the library with the games you last opened, newest first, that scrolls sideways through the whole history rather than stopping at a handful. On a playlist it shows only what you played *on that playlist*, and vanishes entirely when that is nothing. Games opened straight from an emulator are noticed too, not just ones launched from here.
          - **Far more games have covers.** Measured across every file in the index: art was found for 70% of them before, and 85% now. The app used to guess at filenames and hope; it now reads what the thumbnail server actually has and matches against it. Homebrew, hacks and prototypes gained the most — a game that never came in a box has no box art to find, so those fall back to the title screen or an in-game shot rather than a blank tile.
          - **It tells you when a download finishes** — in the app, and as a desktop notification when the window is not the one you are looking at. There is a switch for it under Settings → Downloads.
          - **...and now makes a sound.** A short chime as each download lands, for when the app is behind something else. The speaker button in the Downloads panel silences it, and stays silenced.
          - **Unpacking has a progress bar,** and now a real percentage with it, for `.zip` and `.7z` alike. A single-file archive — which is nearly every ROM — used to sit at 0% for the whole unpack and then jump to done, because progress was only counted between files rather than through them.
          - **Backup and restore.** Saves your settings, download list, playlists, recently played and hand-picked covers to a zip you can carry to another machine. Your games and the search index are deliberately left out: both are large and both rebuild themselves.
          - **Choose what goes into a backup,** including whether it carries **folders and emulator paths**. That one is separate on purpose: two computers keep their games on different drives, so a backup made on one would otherwise land on the other pointing at folders that are not there. Leave it out and the machine you restore onto keeps every path it already had.
          - **Every console at once.** Settings → Paths still opens on one console at a time, but "All consoles" now fills the window with all of them in columns. Tick several and set one emulator or core across the lot — one RetroArch runs a dozen systems, and setting it a dozen times through a dropdown is a job people abandon halfway.
          - **Arrange the library how you like it.** Drag a console heading to move it, star one to keep it at the top, and fold every console open or shut with one button.
          - **Covers can fetch themselves,** and can go when the game does. Two switches under each console's cover folder: box art downloaded as each game lands, and — separately, because they are different amounts of trust — the cover deleted when you delete the game. A covers folder is often an emulator's shared thumbnails folder full of images this app never put there, so nothing is removed unless you ask.
          - **Deleting a game tidies up after itself.** Its row under "Finished" in the Downloads panel goes too, instead of sitting there offering to open a folder that no longer exists.
          - **Settings has tabs.**

          ## Fixed

          - **"Unsorted" is gone, and the reason it filled up is fixed.** The scan learned which consoles existed from the *search index*, so a folder sitting there plainly named `PSP` was only recognised as PSP if the index happened to list it — and on a fresh install, where the index has not been built yet, that meant every game landed under "Unsorted". Console names now come from the list that ships with the app, so the folders are read correctly whether or not anything has been indexed. There is no "Unsorted" console any more either; anything genuinely outside every console folder is named in a line above the shelf, with a button that finds and links the folders.
          - **With "folder per console" switched off, every game was filed under one arbitrary console** — three games on three different systems all appearing as GameCube. A folder is now claimed by the console whose folder it actually is, and one shared by several consoles is left for the index to identify game by game.
          - **"Unsorted" was also full of things that are not games.** A folder holding ROMs was treated as one game, so `NES Jogos` with a hundred games inside became a single entry called "NES Jogos". And an emulator installed in the download folder contributed its firmware, shader caches and Dolphin's `IPL.bin`, because `.bin` is also what a PlayStation track is. Folders are now judged on whether their contents add up to one game, and the folder holding a program you picked in Settings is left alone.
          - **Games with no console folder now find their console.** The index already knows what machine a game is for, so it is asked — by name, narrowed by what the extension means. A name that is genuinely on six consoles stays unplaced, because a wrong console is worse than none.
          - **PlayStation games appeared two or three times over.** A disc rip is a `.cue` naming one or more `.bin` tracks, and each file was judged on its own. Files in a folder are now read together, and Play opens the `.cue` rather than a track that would boot to a black screen.
          - **Some games wore the wrong cover** — a USA release showing the Asian or European box. Where a game exists in several editions the exact filename is preferred, then the matching region, rather than whichever happened to sort first.
          - **The console filter in search kept what you last typed into it.** Type "nin", pick a console, search, then go back to change it and the list was still filtered — often to nothing, with the box that explained why scrolled out of sight. What you type now belongs to that opening of the menu.
          - **The page scrolled behind open windows.** Opening Settings on top of a long list of results and turning the wheel moved the results underneath. It stays put now.
          - **Removing a download took a second or more to disappear,** and up to six on one still running, because the row waited for the file to be deleted first. Rows leave immediately and the deletion catches up behind them. Removing games from the library no longer blanks the whole shelf and re-reads every folder either.
          - **The library icon looked like a pause button** — two tall bars, sitting two places from a download arrow. It is a grid of covers now.
          - **Settings was too small to open its own console list in,** clipping most of it. It also lost the × beside the console picker to the line below.
          - **More of the app speaks Portuguese,** including the archive.org sign-in window and the backup description. Both were caught by the same underlying fault: only the first run of text in an element was translated, and any sentence long enough to be wrapped across lines in the markup could never be matched at all.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit distributions — Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+, Arch — and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or minimal systems may not have what it expects.

          Controller support accounts for the way Linux reports pads, which differs from Windows: a d-pad that arrives as an axis rather than buttons, a DualShock/DualSense whose raw button order starts at Square, and a controller that never announces itself to a page that was already open.
          EOF
