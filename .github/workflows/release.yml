# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## New

          - **Playlists.** Make your own lists with the + on any game, in the search or in the library. A playlist holds games rather than files, so it can hold things you haven't downloaded yet — which is the point: a wishlist and a shelf are the same list at different times. Each list appears as a shelf above the library, and one that has entries you don't own yet offers to download the missing ones or add them all to the download list.
          - **Play a game from the library.** Right-click any game and choose Play. Set the program once per console under Settings → Folders and emulators, with a second box for arguments if it needs them — RetroArch wants its core there. An extracted game is a folder rather than a file, so the app picks what to hand over: a .m3u or .cue that describes the disc before the .bin files that only hold pieces of it.
          - **One Settings dialog.** Theme and language, the download settings and the per-console folders are now one place, reached from the gear in the header. Each panel keeps a gear of its own, and those open Settings showing only what that panel obeys — the downloads panel its folders, the download list its one option — so a gear on a panel answers for that panel rather than for everything.
          - **Take a download off the list and keep the files.** The × on a finished entry now forgets the download without touching what it wrote. Deleting the files is still there and still asks first; the two are no longer the same button.
          - **Delete a cover file.** Where a console has a cover folder set, the right-click menu can delete the image saved in it. Only a file in that folder, by name, is ever touched.

          ## Fixed

          - The info bubbles in Settings were clipped by the edge of the dialog, so the ones near the bottom were half a sentence. They are drawn above the dialog now and flip to whichever side has room. All of them have been rewritten shorter, and the Emulator one no longer runs off its own edge sideways.
          - The "Save to" box drew white on the dark theme.
          - Jumping to a game from an "In Library" marker used to glow once and fade, which was easy to arrive too late for after the scroll. It now pulses for three seconds.
          - Settings had a fill-the-window button that did nothing — the stylesheet had no rule for it. Removed rather than fixed: Settings already sizes itself to its widest group.
          - The library toolbar puts the game count, the gear and the new-playlist + in one column down the right edge instead of scattering them.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit distributions — Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+, Arch — and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or minimal systems may not have what it expects.

          Controller support accounts for the way Linux reports pads, which differs from Windows: a d-pad that arrives as an axis rather than buttons, a DualShock/DualSense whose raw button order starts at Square, and a controller that never announces itself to a page that was already open.
          EOF
