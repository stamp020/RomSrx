# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The frontend is thirteen thousand lines of JavaScript that nothing
      # else compiles. A syntax error in it builds perfectly cleanly and ships
      # an app that opens to a blank window, because the only check anywhere
      # was that app.js exists. Node is on both runners already.
      - name: Check the frontend parses
        run: |
          for f in web/*.js; do node --check "$f"; done
        shell: bash

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Kept in step with upload-artifact above: the two majors are a matched
      # pair, and a download that does not understand what the upload wrote
      # fails at the last step of a release, with the build already paid for.
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## ☁️ Your setup on every computer you play on

          **No account, no server, nothing to pay for.** Point RomSrx at a folder your own cloud keeps in step — OneDrive, Google Drive, Dropbox, iCloud — or at your own WebDAV server, and your settings, playlists, memory cards and save history follow you between machines.

          - **Tick what travels.** Ten parts, each showing its real size. Save states are off by default: on one machine they were 366 MB against 76 MB for everything else combined.
          - **Where this computer keeps its games never travels.** Two machines put them on different drives.
          - **Nothing is lost in a conflict.** Changed on one side, it copies. Changed on both, the newer wins and the older is kept beside it.
          - **Sessions from another computer say so** — a `from Laptop` chip in Earlier saves, so you know which machine a save came off before you restore it.
          - **Sync on its own**, if you want it: fetches when the app opens, sends after you close a game. Never mid-game, never more than once a minute.
          <sub>WebDAV has a provider dropdown — Nextcloud, Koofr, pCloud, Box, Fastmail, Synology — that fills in the address. Google Drive, Dropbox and OneDrive do not speak WebDAV; use the folder option for those.</sub>

          ## ⚡ Which source is actually fast

          **A Test speeds button on every download list.** The same PlayStation 2 disc came back at 11 MB/s from one archive.org item, 4 MB/s from another, 7–9 MB/s over MiNERVA and 401 from a third. That cannot be looked up, only measured — so it is measured, a few seconds from each shelf at once, and the fastest is marked.

          Torrents report their seed count and say they are still climbing, because eight seconds cannot measure a swarm that takes thirty to open up.

          ## 💾 Earlier saves, properly

          - **A note on any session** — *before the point of no return* — saved as you type.
          - **The game it was**, recorded at launch. A memory card cannot say what wrote it.
          - **Which console**, for RetroArch, named for what it plays rather than the core: `Game Boy · Game Boy Color`.
          - **Restore one console** out of an evening, instead of the whole night.
          - **Delete** a session, with a confirmation that names it and says the files are not backed up anywhere else.
          - **Pin** one to keep it past the fifteen days — and a pin does not cost you a day of the fifteen.
          - **Days fold**, today open, the rest closed. A folder button opens the files.

          ## 🏆 RetroAchievements

          - **Subsets as the site shows them** — a row of icons with `Base Set — 17 achievements worth 705 points (5,552 · ×7.88)` underneath.
          - **Who wrote each hint**, with their picture, and their profile a click away. Links in comments open in your browser.
          - **One slider sizes everything**, comments included, in all four places the list appears.
          - **A pop-out button** wherever the list is shown, and the window closes when the game does.
          - **Sign the emulators in.** Sign in to one, and RomSrx copies that login to the others. Your password is never asked for or stored — the token is the account's, and one emulator already has it.

          ## 🐛 Fixes

          - **A playlist made from your own library could not be downloaded.** Entries built from games on disk carried no source, so after moving your games folder every download button quietly disappeared. The index is asked now — and it gives back the dump you had, not merely the best one: asked for `Spyro the Dragon (USA)` the ordered list leads with a Russian fan translation.
          - **An interrupted MiNERVA download could be destroyed or truncated.** Resume compared the part on disk against the size from a listing, and MiNERVA's listings drift a few bytes. A part slightly over was deleted and restarted from zero; a part matching exactly was renamed and called finished, a few bytes short. The server decides now, not the listing.
          - **Mastered showed on the wrong regional copies.** One set covers a game; your index holds it under three titles. Mastering the USA disc marked the Japanese and European cards too, on releases that set has never heard of.
          - **The app could load for ever with no explanation.** One failed request left the opening question dead — no error, no retry. It retries, then says so, and you can press to try again.
          - **A resumed torrent said 0 bytes first.** It reports what is already on disk once the check finishes, instead of before.
          - **A folder-type PCSX2 memory card was offered as a console.**
          - **The Mastered and Beaten bars vanished** under the ranked filters.
          - **A download row can say where it came from** even when the job never recorded it — looked up from the URL.
          - **Settings opens before the index is built**, showing the backup and sync sections — which are how you skip building one.
          EOF
