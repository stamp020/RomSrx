# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## New

          - **A game's RetroAchievements page, from the right-click menu.** On a search result, in the library, on the download list and in the Downloads panel: right-click a game and open its page on retroachievements.org. The entry only appears for games that actually have one, so it is never an invitation to a dead end — which of your games have a set is worked out as each page is drawn, from RetroAchievements' own list of every game with achievements.
          - **Those pages open in a window of the app's own,** beside the library rather than over it, so a game and its page are readable at the same time. Signing in there is remembered between sessions, so it is done once. The window keeps its own place and size — put it on a second monitor and that is where it opens next time, and if that monitor is gone it comes back to the main one rather than opening somewhere you cannot reach.
          - **Or in your own browser, if you would rather.** Settings → Web pages, where you are probably signed in already. Whichever you pick, the other covers for it if it cannot be used.
          - **A RetroAchievements button in the header,** for the site itself rather than any one game. It sits with the patch tool, on the other side of a divider from the two download buttons, so the header reads as what it is: getting games on one side, reading about them on the other.
          - **Back, forward and reload in that window.** A window opened this way has no address bar and no menu, so following a link out of a game's page used to mean closing the window and starting again. The three controls sit in a small bar in the corner, faded until the pointer is near them, and they work from the keyboard too — F5 or Ctrl+R to reload, Alt+← and Alt+→ to move through the pages you have seen.
          - **That bar can be dragged anywhere,** and stays where it is put — including next time the window is opened. A bar left somewhere that no longer exists, because the window has since been made smaller, is pulled back on screen rather than stranded off the edge.
          - **Covers open full size.** Click the artwork on a search result, in the download list or in the Downloads panel and it opens in the middle of the screen at the resolution it was downloaded in — the grid has always been showing a shrunken copy. The save button sits under the picture; right-click still saves it without opening.
          - **Drag a console by its name.** The dotted grip still works; so does the console's name beside it, which is the obvious thing to reach for. A press that does not travel still folds the console, as it always did.
          - **How long you have played each game,** on its cover in the library and in its own column beside the file size in list view. It is read from the emulator that actually ran the game, so it counts sessions this app knows nothing about: RetroArch keeps a runtime log per game, and PCSX2 and DuckStation each keep a total per disc. A game played on two RetroArch cores adds the two together, and a time from PCSX2 is only ever shown against a PlayStation 2 game, never the Wii release of the same title. Nothing is configured for this — the emulators are found where they install themselves, whether or not this app is set up to launch them.
          - **Games played in anything else show no time,** which is the honest answer rather than a zero. PPSSPP does not record play time at all, and neither do Dolphin, BizHawk, Flycast or the standalone RetroAchievements builds.
          - **A patch tool, built in.** The button beside RetroAchievements in the header opens it: pick a game, pick a patch, and it writes a patched copy next to the game. Your own file is never modified, so a patch you decide against is one file to delete. Right-clicking a game in the library offers the same thing with that game already filled in, so only the patch is left to choose.
          - **Four patch formats are read** — BPS, IPS, xdelta and PPF — whether they arrive loose or inside a .zip or .7z. That covers what RetroAchievements publishes and most of what anyone else does. The one kind still refused is an xdelta patch compressed with xdelta3's own codec, which is named as such rather than half-applied.
          - **Disc games are patched too,** including images of several gigabytes. The file is read straight off the disk and the result written as it goes, so a three-gigabyte PlayStation 2 image is patched in about a minute using a few megabytes of memory rather than several gigabytes of it. A patched .bin gets a matching .cue of its own, since without one the patched track would never be the one that loads.
          - **The patch a set needs, fetched for you.** Where RetroAchievements publishes one, "Download patch" sits in the game's right-click menu and saves it — through the app rather than handing it to a browser, so it lands in a folder you chose rather than wherever the browser puts things. Settings → Downloads says where; left blank it uses a Patches folder beside your games.
          - **When a game has several patches, it asks which.** Nearly four hundred games have more than one — the first Zelda has nineteen, between translations, a cosmetic set and a flash removal. Picking one silently would have been choosing for you.
          - **The patched copy is named after the patch that made it,** so a translation and a 60fps hack of the same game sit side by side as two files rather than one quietly replacing the other. Nothing is ever written over: a name already in use gets a number rather than the file it would have destroyed.
          - **Or it can simply replace the game,** if you would rather not keep two copies. Settings → Downloads, off unless you switch it on: the patched version takes the game's own name and the original is deleted. The order is chosen so there is never a moment when the game exists under neither name - the original is moved aside, the patched file takes the name, and only then is the moved-aside copy removed. A game kept as a .zip or in a folder of its own is left alone either way, since replacing the container with a bare ROM would leave the library describing something that is no longer there.
          - **It refuses rather than producing a broken ROM.** A BPS patch carries a fingerprint of the exact dump it was made for, and a mismatch is reported as one — the wrong region, the wrong revision, or a file that is simply the wrong size. Before anything runs, a short note says what a patch is and what is about to happen, and when it finishes it names the file to play rather than printing a path.
          - **A way out for the patches it cannot apply.** Inside the patch tool, "Patch online instead" opens a patcher that runs in the browser and reads formats this app does not. Your ROM stays on your machine either way.
          - **Play, without going to the library.** A search result already in your library gets a play button beside its "In Library" mark, and a finished download gets one next to the folder button — so a game can be started from wherever you happen to be looking. It only appears where a console has an emulator set, since a button that can only apologise is worse than none.
          - **The reindex window can close itself** when it finishes, if you tick the box at the bottom of it. Closing that window has never stopped the indexing — this is only about whether you are left watching it end.
          - **A full-width layout,** in Settings → Look and language. The page fills the window instead of sitting in a column down the middle, which on a wide screen is two more columns of games. Only the width changes.
          - **The index is kept with your own files now,** in %APPDATA%\RomSrx rather than beside the program, so replacing or reinstalling the app no longer costs you a reindex — and it can go in a backup. It is offered there as its own tick box, off by default: it is far larger than everything else and the one part that rebuilds itself from archive.org.
          - **Restoring a backup offers to restart the app** rather than telling you to. Some of what a restore puts back — the index above all — is only read when the app starts.

          ## Fixed

          - **You can scroll while dragging a console.** The mouse wheel now moves the page mid-drag, and holding the pointer near the top or bottom edge scrolls it too, faster the closer you get. Before this, a console could only be dropped somewhere already on screen — which is no use in a library long enough to want rearranging. The reordering no longer uses the browser's own drag-and-drop, which is what was swallowing the wheel.
          - **Far more games find their RetroAchievements page.** About 2,100 more files across the index, from four naming differences between what the sets are called and what the files are called: a studio's name in front of the title (*DreamWorks Madagascar* against *Madagascar*), spacing (*Choro Q HG 2* against *Choro Q HG2*), Roman against Arabic numerals (*Bloody Roar 2* against *Bloody Roar II*), and the build number on a homebrew release. Fan hacks are matched too, against their own pages. Matching stays exact on purpose — *Bloody Roar 3* and *Bloody Roar 4* are not the same game, and a menu entry that opens the wrong page is worse than no entry.
          - **A bad hour at archive.org no longer costs a whole afternoon.** A source that stalled was tried three times with a two-minute limit each, which turned a slow evening into an index of several hours. The limit is now forty-five seconds — a healthy answer takes about one — a server asking to be left alone is believed rather than hammered, and a source that simply is not there is given up on at once instead of being asked three times.
          - **Twelve more sources,** for hacks, homebrew and unlicensed releases across the NES, SNES, Game Boy, Game Boy Advance, Mega Drive, GameCube, Wii and Dreamcast.
          - **A way to check the sources without indexing.** `RomSrx.exe checksources` asks archive.org about every source once and says which answered, which are empty and which could not be reached — and whether a slow index looks like the connection or like the amount there is to fetch. It writes what it found to a file, so it works from a packaged build with no console attached.
          - **"Load more" vanished after a look at the library** and did not come back until the next search. It was being hidden on the way in and never told why, so on the way out it had nothing to restore.
          - **The release notes window was too narrow to read comfortably.** It was opening at the width meant for a one-line question rather than the wider one meant for prose — this window, in fact.
          - **The download list's settings window was far bigger than the one switch inside it.**
          - **Portuguese reached three more places:** the "All consoles…" button under Paths, the names of the accent colours, and the download list's "select all" — which shared a translation with the backup window's, where it needs a different word.
          - **Before the first index is built, nothing else can be opened.** Settings, the library, the download list and the rest all need an index that does not exist yet, and opening them only produced empty windows that looked broken. Everything is now shut until the index is built — the button in the middle of the page and the ↻ in the corner are the only two things that do anything.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit distributions — Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+, Arch — and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or minimal systems may not have what it expects.

          Controller support accounts for the way Linux reports pads, which differs from Windows: a d-pad that arrives as an axis rather than buttons, a DualShock/DualSense whose raw button order starts at Square, and a controller that never announces itself to a page that was already open.
          EOF
