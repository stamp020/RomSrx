# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## New

          - **A box for the RetroArch core, with its own picker.** Setting a core meant typing `-L "C:\RetroArch\cores\something_libretro.dll"` into the arguments field, quotes and backslashes and all, and getting any of it wrong left RetroArch opening its own menu with no sign of why. It has a field of its own now, next to the emulator, with a **…** button that opens a file picker filtered to cores. The arguments box stays for anything else the program wants.
          - **Detect console folders.** A button in Settings → Folders and emulators that looks for a folder named after each console and writes down where it is. It searches the main download folder *and* beside every console folder you have already set, so a collection spread across drives is found in one press. Consoles whose folder has moved or changed drive letter are re-pointed; ones that still work are left alone. Nothing on disk is moved, renamed or deleted, and **Clear all** undoes it.
          - **Check for updates answers where you asked it.** It now opens a window with the version, the download and the release notes. The bar along the top stays — that is what tells you about an update on a launch where you asked nothing.

          ## Fixed

          - **Selecting text in a window could close it.** Drag across a path to replace it, let go past the edge of the window, and the window took that for a click on the background and shut — losing the edit. Dismissing a window is now a gesture that has to *start* on the background; letting go there is not enough.
          - **The + on a game lit up more than the copy you added.** One game is mirrored across several archive.org items, so `Spider-Man 2 (USA).zip` appears under Redump, under a RetroAchievements collection and under that year's Redump pack — same name, same size, same console. Copies are now told apart by their address rather than their filename, so exactly the row you pressed lights up and no other. Adding a different copy of something already on a list re-points the entry at the one you just picked, rather than appearing to do nothing.
          - **PlayStation games appeared two or three times over.** A disc rip is a `.cue` naming one or more `.bin` tracks, and each file was being judged on its own, so one game became a row for the cue and a row for every track. Files in a folder are now read together: the descriptor claims the tracks it names, and Play opens the `.cue` rather than a track that would boot to a black screen. The same folding covers a game kept as both a `.zip` and a `.7z`.
          - Release notes opened in a box sized for a one-line question, which turned a paragraph into a narrow column you scrolled rather than read. They get a wide box now.

          ## Security

          - A page on the open web could make your browser send commands to RomSrx running on your own machine — a plain HTML form is enough, and the request arrived looking local, which was the only thing being checked. Deleting games, changing the download folder and rewriting playlists were all reachable that way. Requests now have to come from the app's own window.

          ## Downloading this release

          The Windows build is not code-signed, so Edge and SmartScreen may warn about it or block the download outright. Nothing is wrong with the file — an unsigned installer with no download history is treated as suspicious on reputation alone. If Edge blocks it, open **Downloads**, click the **⋯** beside the blocked item and choose **Keep**.

          This build carries proper version information for the first time, and is explicitly built without UPX compression — both are things scanners weigh, so it should be flagged less often than v1.0 was. Signing is the only complete fix and is not in place yet.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit distributions — Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+, Arch — and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or minimal systems may not have what it expects.

          Controller support accounts for the way Linux reports pads, which differs from Windows: a d-pad that arrives as an axis rather than buttons, a DualShock/DualSense whose raw button order starts at Square, and a controller that never announces itself to a page that was already open.
          EOF
