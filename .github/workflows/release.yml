# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The frontend is thirteen thousand lines of JavaScript that nothing
      # else compiles. A syntax error in it builds perfectly cleanly and ships
      # an app that opens to a blank window, because the only check anywhere
      # was that app.js exists. Node is on both runners already.
      - name: Check the frontend parses
        run: |
          for f in web/*.js; do node --check "$f"; done
        shell: bash

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Kept in step with upload-artifact above: the two majors are a matched
      # pair, and a download that does not understand what the upload wrote
      # fails at the last step of a release, with the build already paid for.
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## 🖼️ The library, redesigned

          **One row of controls instead of three.** There were twenty-five of them on screen at all times and the shelf started a third of the way down the window. Most were settings rather than actions, so they sit behind two menus named for the question they answer — **Sort** for what is on the shelf and in what order, **View** for how it is drawn — with the four windows the library opens behind an overflow. What stayed out is what you use while looking at the shelf.
          <sub>Every control was moved rather than rebuilt, so nothing about how they behave changed.</sub>

          **Picking games is a mode now.** Select all, Add to playlist and Remove used to sit in the bar permanently with three of the four hidden; an accented bar appears when you press Select, says how many are picked, and leaves when you are done.

          **Continue playing is a carousel.** One game in front at full size with the rest turned away behind it, and no ends — drag past the last and the first comes round again. A switch on the heading puts it back to the plain row, and **both drag**: press anywhere on the row, on a cover or the gap between two, and pull. It folds away by its own heading like a console, and remembers.
          <sub>Every cover in that row is the same height and keeps its own width, so nothing is cropped and the row does not wobble as it turns.</sub>

          ## ⌨️ The keyboard

          **Shortcuts, at last.** The app could already be driven end to end with a controller and not at all with a keyboard, which is the wrong way round for a thing whose main verb is typing a game's name. **`/`** or **`Ctrl K`** puts the cursor in the search box from anywhere, **`↑ ↓`** walk the results, **`Enter`** opens the one you are on and **`Ctrl D`** adds it to the download list. **`S`**, **`L`**, **`D`** and **`C`** are the four tabs, **`Esc`** clears the search, and **`?`** lists the lot. A key pressed while you are typing is just typing.

          ## 🔎 Search

          **Did you mean.** Search for `castlevaina` and the app used to tell you to guess again — about a catalogue of forty-three thousand titles it has entirely on disk. It now offers the closest one, and only on a miss, so an ordinary search costs nothing extra.

          **The whole-site orders finally respect the search box.** "Quickest to beat" threw away the title you had typed and the region you had chosen and answered about the entire catalogue. It now ranks whatever you are actually looking at — a search, a console, a region, or with an empty box, everything.

          **One "Order by" instead of two.** Two controls for one question, and the second one answered a question nobody asked. How far the order reaches depends on whether *Time every set* has run: with the times on disk every matching game can be ranked, without them the ones already loaded, and the note under the box says which you are getting.

          **Games you have finished say so on the cover** — grey for beaten and drained of colour, your accent for mastered — with a **Played** menu to leave either out of the results. Taken from RetroAchievements' own award, because beating a game is finishing its progression set and no count of achievements can tell you that.

          **Games with no box art show their name** rather than a blank grey rectangle, and **a game already on your shelf gets a play button** on its poster.

          **Cards in a row are the same height.** A game with a short name and no time badge ended a hundred pixels above its neighbour.

          ## 🎮 The game panel

          **Rebuilt, and half as wide again.** Real box art at 200px, a proper masthead with the title and the two things you might do about it, both medians side by side under what you have earned, and four screenshots across with the rest behind a band on the last one.

          **Download it from the panel.** Deciding you want a game used to mean closing the window, going to the search and typing the name back in — the app already knew the name. The copies in your index are listed here, **with the ones the achievement set was built from marked**.

          **A game you already own offers Play** instead, in your theme colour.

          ## 🏆 The RetroAchievements profile

          **Arrange it in one, two or three columns.** Each block says which column it is in and the arrows move it, and **each layout remembers its own arrangement** — the order that reads well in one tall column is not the one you would choose across three.

          **The awards wall.** Mastered, beaten and events can be shown together rather than behind tabs, each run behind its own heading, folding away on its own, laid out five across. Mastered is a ring around the badge rather than a panel behind it, and the toolbar is four switches instead of a row of tick boxes and sentences.

          ## 🧲 MiNERVA

          **A new source, and a big one.** MiNERVA is where Myrient's collections ended up, and **99 of its shelves are now indexed** alongside archive.org — every console this app knows, across four groups: **Redump** for the disc systems, **No-Intro** for the cartridges, **RetroAchievements** for the exact dumps its sets were built from, and the **T-En** English fan translations that exist nowhere else. That is 94,704 games, and one PlayStation listing alone is 11,170 of them. They show up in search with sizes and a 🧲 mark so you can tell at a glance which copies arrive differently.
          <sub>The RetroAchievements shelves are the interesting ones for this app: a copy from there is one its set accepts by construction, so it earns achievements without having to be hash-checked first.</sub>

          **It shares a whole console as a single torrent, and this app takes only the file you asked for.** BitTorrent has always been able to fetch one file out of eleven thousand; what it needs is a way to name which, and the torrent's own metadata is the one thing that cannot be wrong about that. Everything else is set to priority zero, so an 11,000-game collection costs you one game plus a few megabytes at the piece boundaries.
          <sub>The site publishes a per-row number that looks exactly like a file index. It is not one — it counts rows in the listing, which holds entries the torrent does not. Trusting it downloaded a perfectly good copy of the wrong game, silently, which is why the filename is what gets used.</sub>

          **Privacy is a setting, not a promise.** A torrent uploads while it downloads, so everyone in the swarm sees your address rather than one server — the app says so once, before the first one, rather than after. Settings → Downloads → Torrents can **bind everything to one network adapter**, which is the real kill switch: name your VPN's adapter and nothing leaves by any other route, and if the VPN drops the transfers stop instead of quietly carrying on. There is **SOCKS5** for providers who sell one, with peers, trackers and name resolution all going through it. Upload can be capped separately from downloads.
          <sub>These magnets carry no trackers, so peers come from DHT, which is UDP — and most SOCKS5 proxies will not carry UDP. Where that matters the tooltip says so, and binding to the adapter is the better answer.</sub>

          **Without libtorrent it degrades rather than breaking:** the game offers its magnet to whatever torrent client you already have, naming the exact file to pick.

          ## 💾 Downloads, and the rest of the machine

          **A speed limit.** A ceiling on the whole app rather than on each transfer, so three at once share it instead of taking three times as much. Set it in Settings → Downloads; 0 is no limit.

          **Pause while a game is running.** This app is the thing that launched the game, so unlike a general-purpose downloader it actually knows. Nothing is cancelled and nothing restarts — the transfer waits where it is and carries on when you quit.

          **It checks there is room first.** Queue a batch bigger than the disk it is going to and the app says so before it starts, per drive, rather than at 94% of forty gigabytes. Free space is shown beside the download folder in Settings too.

          **A copy that will not earn achievements can now be replaced, not just supplemented.** The app already found and fetched the dump the set was built from; it stopped there, leaving two copies of the game and one of them useless. It now offers to take the old one away once the new one is really on the shelf — named in full, and never automatically.

          ## 💽 Emulator saves

          **Backed up on their own.** The one thing in this app that cannot be downloaded again: the index rebuilds, the covers re-download, the settings are a few minutes of typing, and a memory card with sixty hours on it is gone. Daily, weekly or monthly, taken when the app opens if one is due, keeping the last three. Off unless you ask — these run to hundreds of megabytes each, and the panel shows what they are costing.

          ## 🔔 Progress, sound and colour

          **The window says how far along the downloads are.** Its title reads “RomSrx — 3 downloading, 41%”, so the taskbar tooltip and the alt-tab list say it too, and the taskbar button fills up behind the icon the way a browser's does. It is measured in bytes rather than in jobs — three downloads at 90% and one at 5% is not “four downloads, 71% done” to anybody watching a bar. This is what replaced notifications, which could not be made to appear from the app's window at all.

          **A volume slider for the download chime,** with the level it has always been as the middle, and mute beside it.

          **Any colour you like.** The nine named ones are still there — each picked to stay legible on all three tones — with a picker of the app's own beside them. Not the system colour dialog: that one is white whatever the app looks like.

          ## 🌐 Portuguese, and the rest of the interface

          **Everything is in Portuguese now, tooltips included.** Around a hundred and twenty strings were still English: whole toolbars, every info bubble in Settings, the sixteen arrows in the profile window, the download progress line, and a tooltip whose text was wrapped across two lines in the markup and so could never match its translation however carefully it had been written. **Region names are translated too** — EUA, Japão, Alemanha — on file rows, on card badges, in the filter menu and in Settings, all from one list, while the value the filter matches on stays exactly as the index wrote it.

          **The achievement count is separated by a middle dot** rather than by an empty box and a stray four. A control character had found its way into the stylesheet.

          ## ⏱️ Times, sets and suggestions

          **Time every set, once.** RetroAchievements publishes a median one game at a time, so the two time orders could only ever rank what was on screen. One run from Settings prices every game with a set your index can fetch and keeps the answers; a second run asks only about sets that are new or have changed. The scan says how far it has got and roughly how much longer.

          **Order the whole site by set size** rather than only the page you are looking at.

          **"Games you might like" and "Games you want to play" got the same treatment:** proper box art at the same size in all three windows, the card opens the game's panel, and a **Select** mode adds a run of them to a playlist or the download list in one go — choosing a copy the achievement set accepts where there is one.

          **"From my library"** brings back the suggestions your shelf actually argued for. Narrowed to one console they run out quickly and everything else with a set fills in behind them, and after a shuffle the reasoned few could be anywhere.

          **"Show every game" in What to play next really shows every game.** The server had been honouring it all along; the page kept only the first eight.

          ## ✅ Does this copy actually earn achievements?

          **A set is not attached to a title — it is attached to particular dumps, and RetroAchievements knows them by a hash.** The app works out that same number from the file on your disk and compares it against the set's own list, so the answer is certain rather than a good guess.
          <sub>The rules are ported from rcheevos, the code the site itself runs: headers skipped for NES, FDS, SNES, PC Engine, Atari 7800 and Lynx, a Nintendo 64 ROM normalised to big-endian, and a DS card hashed from its header, boot code and icon block alone. Zips, folders and .7z are looked inside; anything holding two ROMs is reported as unclear rather than guessed at.</sub>

          **PlayStation and PlayStation 2 discs are opened too.** A disc's number comes from the program the disc boots, so the image is walked as a filesystem and hashed from the executable named in SYSTEM.CNF.
          <sub>.chd and .rvz are compressed formats this app does not decode, and GameCube, Wii, Dreamcast, Saturn, Sega CD and PSP each have a rule of their own that is not implemented. All of those say "not checked", never "this copy failed".</sub>

          **A tick or a cross on every game, and a shelf that can be narrowed to the copies that will not earn anything.** Settings → Library checks the lot; the same check is on a game's right-click menu and in its panel. The marks can be switched off.

          **When a copy does fail, the app looks for one that works** — the set names the dumps it was built from and your index is a list of files.

          **Every search result is checked in the background,** or only the ones whose button you press: that is a setting now, since checking everything costs a request per console behind every card.

          **Copies from RetroAchievements' own collections are recognised,** with a quieter mark of their own — "this is the dump the set was built from" and "this came out of their set" are both good answers and not the same answer.

          ## 🎯 Your Want to Play list, in the app

          **The list you keep on retroachievements.org, matched against your index.** Each game says what can be done about it: already on your shelf, ready to download, a hack that needs the patcher, or nothing your sources carry.
          <sub>Their titles and a preservation set's rarely agree — they write *The Legend of Spyro*, No-Intro writes *Legend of Spyro, The*. Both sides are folded the same way; on a real list of 78 that matched 70.</sub>

          **Right-clicking one works now.** Those rows arrive holding the game's id and the app was looking it up by name through a table the list never filled, so the menu came up empty.

          ## ⚙️ Setup

          **Find my emulators.** One press looks where installers put things and points each console at what it finds — PCSX2, DuckStation, Dolphin, PPSSPP, RetroArch. A console already pointed at something is left alone unless you say otherwise.

          **Will this session count?** Settings reads RetroArch's own configuration and says so when achievements are off, hardcore is off, nobody is signed in, or the account is not the one configured here. Read and never written.

          **Play time comes from RetroAchievements first.** Most emulators keep no runtime log, so games played in Dolphin or PPSSPP counted as "never started".

          **A set is kept between sessions,** so the achievement list works with no connection — and the app notices when a set has been revised since you last looked.

          ## 🐛 Fixes

          - **Every setting added in this release was being thrown away on restart.** The server keeps only the preferences it has been told about, and nine new ones had not been added to that list — the carousel, the volume, the colour, the profile layout and the rest all lived until you closed the app.
          - **A game on your shelf showed no play button and no "In Library" mark** when the copy on disk was named `(US)` and the index had `(USA)`. Names are compared with the region tags off as well now, with demos and prototypes held to the strict match.
          - **The achievement count in the header was the first thing cut** when a game had a long name — the title and the count were one string being ellipsised together.
          - **A custom accent colour stayed blue in the profile and achievement windows,** which set the name of the colour but never the colour itself.
          - **The Continue playing row resized itself as covers loaded** and sometimes opened with its covers spilling out of it: it took its shape from whichever cover won the load race, and measured itself once, occasionally while it was off screen.
          - **Three columns in the profile could not be filled.** It was CSS multi-column, which balances by height — the browser decided, and nothing could be put in the third.
          - **The phantom play button on every search result** was the expand caret, which took no clicks at all.
          - **Patches published as a .7z would not open.** py7zr removed the call the app used, which broke 257 of the 4,748 games that have patches.
          - **Search showed one mark where a card had fourteen.** Answers were keyed on the filename alone, and one card holds the same name many times over.
          - **Every dump in every set read as having no hash.** The site spells the field `MD5`; the app asked for `md5`.
          - **"Beaten in 10 h 40 min" was not how long it took** — it was the total that person had ever spent in the game.
          - **The daily and weekly rankings listed people who had not played,** pushing the two or three who had off the bottom.
          - **A burst of requests got part of itself refused.** Everything the app asks RetroAchievements queues behind one gate, and a "slow down" is retried once.
          EOF
