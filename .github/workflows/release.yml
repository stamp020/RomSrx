# Builds RomSrx for Windows and Linux and attaches both to a GitHub release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner. Push a tag to fire this off:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/release.bat does that for you, including bumping the version in
# romsrx/__init__.py so the in-app update check agrees with the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing shouldn't bin the other
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: zip
          - os: ubuntu-latest
            name: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The patcher rewrites people's ROMs, and a patch format read even
      # slightly wrong produces a file that looks fine and is not. These run
      # before anything is built, on both platforms, and need nothing
      # installed and no network.
      - name: Test
        run: python tests/run_all.py

      # -RequireWebview so a runner that somehow ends up without pywebview
      # fails the release rather than publishing a build with no window.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./build.ps1 -NoPause -RequireWebview

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="RomSrx-${version}-${{ matrix.name }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" RomSrx
          else
            tar -czf "../${name}.tar.gz" RomSrx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: RomSrx-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSrx $GITHUB_REF_NAME" \
            --notes-file - \
            RomSrx-*.* << 'EOF'
          ## 🎨 Covers, from three more places

          **Real box art for 6,500 more of your games.** Measured across the whole
          index: **79% → 86%**.
          <sub>libretro's free thumbnail server still answers first and still costs nothing. Three optional services fill in what it has never heard of — each needs a free account of your own, and until you add one nothing changes at all.</sub>

          **RetroAchievements, IGDB and SteamGridDB.** Settings → Cover art.
          <sub>RetroAchievements is the only one that is *about* retro games, so it is asked first and is the only source with covers for hacks, translations and aftermarket homebrew. IGDB carries nearly every commercial release. SteamGridDB is community-uploaded and mops up the rest.</sub>

          **You choose the order they are asked in,** and where they sit relative to libretro.
          <sub>Arrows on each panel. Use them only for the games libretro misses, ask them first and fall back, or drop libretro entirely — the third is honest about its cost: a game they cannot match shows nothing.</sub>

          **A screenshot never beats a real cover any more.**
          <sub>libretro falls back to title screens and in-game snaps for anything that never came in a box, and those used to win purely for coming from the same server as the boxes. They are now the last thing tried anywhere.</sub>

          **Your keys never leave this machine.**
          <sub>Kept in the app's own folder, deliberately left out of backups, and never sent anywhere but the service they belong to.</sub>

          ## 🖼️ A preview panel for any game

          **Everything known about a game, in one window.**
          <sub>Cover, in-game screenshots, how long it takes, its achievements, and a paragraph about it. Gathered in a single request so the panel opens whole rather than filling in under you.</sub>

          **Up to 20 screenshots, and you can page through them.**
          <sub>Three on the panel and a tile that opens the rest, with arrows either side and the ←/→ keys. Pulled from all three services at once, deduplicated by content so a game filed under four disc names does not show the same picture four times.</sub>

          **Opened from wherever you are.** A button on a library tile, a column in list view, or a click on any cover in search.
          <sub>Clicking a cover used to open just the picture. It now opens the picture with everything else beside it.</sub>

          **Play, straight from the panel** — for games you actually have.

          ## ⏱️ How long a game takes

          **Median times to beat and to master,** from RetroAchievements' own players.
          <sub>Right-click any game with a set. Hardcore only — no save states, no rewind — because the softcore figure measures the emulator more than the game. Tetris is 1h12m one way and 2h30m the other.</sub>

          **Its achievements, points, RetroPoints and RetroRatio.**
          <sub>The same numbers the site shows at the top of a game's page. Super Mario 64 is ×2.88.</sub>

          **Each figure says how many players it came from,** because a median of four people is a different kind of fact from one of two thousand.

          ## 🔍 Search that forgives a typo

          **One word wrong no longer costs the whole search.** `jarry potter` finds all 57 Harry Potter games.
          <sub>A word that matches nothing is dropped and the rest carry the search, rather than the whole query coming back empty.</sub>

          **Apostrophes stopped hiding games.** `theres` now finds *There's Nothing to Do in This Town*.
          <sub>The title is indexed as two words, so what anyone actually types matched neither of them. A thin result is now also matched against titles with their spaces taken out.</sub>

          **A region or file type on the end is ignored** when it finds nothing. `harry potter usa`, `sonic.iso`.
          <sub>Only ever as a fallback, and never the last word — *Super Mario World* ends in a region word and is not a search for Mario.</sub>

          ## 🧹 Tidier menus

          **Right-click menus are half the length.** Patch and cover entries fold away behind a heading.
          <sub>A group hides itself when nothing in it applies, and re-collapses each time, so the menu is the same size every time you open it.</sub>

          ## Fixed

          - **Pictures opened full size were not centred.** Anything wider than about 450px hung off the right edge, further the wider it was.
          - **The same screenshot appeared several times in a row** for multi-disc games, which are filed under one capture per disc.
          - **Title screens appeared twice,** once from each source that had one.
          - **"Emulator for this game" carried a RetroAchievements logo** it had nothing to do with.
          - **Saving a cover from one of the new services** produced a file with the wrong extension.
          - **IGDB screenshots were being missed** for games it files under several platforms — a record with no pictures was hiding its siblings. Kingdom Hearts went from none to ten.

          ## Linux

          The Linux build (`RomSrx-*-linux.tar.gz`) runs on most modern 64-bit distributions — Steam Deck, Ubuntu 20.04+, Debian 11+, Fedora 35+, Arch — and uses system OpenSSL, so it needs OpenSSL 3.x. Very old or minimal systems may not have what it expects.

          Controller support accounts for the way Linux reports pads, which differs from Windows: a d-pad that arrives as an axis rather than buttons, a DualShock/DualSense whose raw button order starts at Square, and a controller that never announces itself to a page that was already open.
          EOF
