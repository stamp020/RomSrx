<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>Profile</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<!-- The signed-in RetroAchievements user, in a window of the app's own.

     Same arrangement the site uses, because that is the one its own users
     already know: who you are and where you rank, then what you have been
     playing, then what you have won, then the people you follow. Everything
     in it is a link back to the real page for that thing. -->
<body class="rawin">
  <header class="rawintop">
    <!-- The picture is the link to the real page, which is where a picture of
         somebody sends you everywhere else on the web. -->
    <button class="rawinface-btn" id="picbtn" data-nopad data-i18n
            title="Open your profile on RetroAchievements">
      <img id="pic" class="rawinpic" alt="">
    </button>
    <div class="rawinwho">
      <h1><button id="namebtn" class="rawinnamebtn" data-nopad></button></h1>
      <p class="rawinrank" id="rank"></p>
      <p class="rawinplaying" id="playing"></p>
    </div>
    <button id="refresh" class="ghost small iconctl"
            title="Ask RetroAchievements again" aria-label="Refresh" data-i18n>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4h-4"/></svg>
    </button>
  </header>

  <div class="timestats" id="stats"></div>
  <!-- The rest of what their own profile prints: what you have unlocked, how
       much of what you start you finish, and what the last month looked
       like. -->
  <div class="rawinfigures" id="figures"></div>

  <!-- Everything below is arranged by the reader: each block carries a pair
       of arrows, and where they put it is remembered. Somebody who cares
       about awards should not have to scroll past six games every time. -->
  <!-- How many columns the blocks flow down.
       Everything here was already reorderable, but only ever as one tall
       column - so on a wide window the awards ran for two screens with a
       hand's width of empty page either side, and "Last played" was nowhere
       near the mastered games it belongs beside. The blocks flow through the
       columns in the order they are already in, so the arrows still arrange
       the page and now decide which column a block lands in as well. -->
  <div class="rawincols" id="rawincols">
    <span class="rawincolslabel" data-i18n>Columns</span>
    <button class="rawincol" data-cols="1">1</button>
    <button class="rawincol" data-cols="2">2</button>
    <button class="rawincol" data-cols="3">3</button>
  </div>

  <div id="sections">
    <section class="rawinsec" data-sec="recent">
      <div class="rawinsechead">
        <h2 class="sethead" data-i18n>Last played</h2>
        <span class="rawinmove">
          <!-- Left and right only appear once there is more than one column
               to move between - see paintCols. In a column layout the blocks
               flow, so "left" is a step earlier in the order and "right" a
               step later; they are the same two moves the arrows beside them
               make, named for what they look like they do. -->
          <button class="ghost small rawinside" data-move="-1" data-i18n title="Move left" aria-label="Move left">&#9664;</button>
          <button class="ghost small" data-move="-1" data-i18n title="Move up" aria-label="Move up">&#9650;</button>
          <button class="ghost small" data-move="1" data-i18n title="Move down" aria-label="Move down">&#9660;</button>
          <button class="ghost small rawinside" data-move="1" data-i18n title="Move right" aria-label="Move right">&#9654;</button>
        </span>
      </div>
      <div id="recent" class="rawinlist"></div>
    </section>

    <section class="rawinsec" data-sec="awards">
      <div class="rawinsechead">
        <h2 class="sethead" data-i18n>Awards</h2>
        <span class="rawinmove">
          <!-- Left and right only appear once there is more than one column
               to move between - see paintCols. In a column layout the blocks
               flow, so "left" is a step earlier in the order and "right" a
               step later; they are the same two moves the arrows beside them
               make, named for what they look like they do. -->
          <button class="ghost small rawinside" data-move="-1" data-i18n title="Move left" aria-label="Move left">&#9664;</button>
          <button class="ghost small" data-move="-1" data-i18n title="Move up" aria-label="Move up">&#9650;</button>
          <button class="ghost small" data-move="1" data-i18n title="Move down" aria-label="Move down">&#9660;</button>
          <button class="ghost small rawinside" data-move="1" data-i18n title="Move right" aria-label="Move right">&#9654;</button>
        </span>
      </div>
      <!-- Beaten on the left, mastered next to it, then the odd ones out. -->
      <div class="rawintabs" id="awardtabs"></div>
      <!-- A toolbar rather than a sentence of checkboxes.
           It was three ticked boxes, a button and a line of grey text all on
           one row, each a different shape and the whole thing reading as a
           paragraph you had to parse. These are four switches and a button:
           the switches look like switches, they carry their meaning in a
           glyph with the words on the tooltip, and they light up when they
           are on. -->
      <div class="rawinawardopts" id="awardopts">
        <span class="rawinawardswitches">
          <button id="iconsonly" class="rawinsw" type="button" role="switch"
                  aria-checked="false" data-i18n
                  title="Badges only, without their names">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
          <button id="awardall" class="rawinsw" type="button" role="switch"
                  aria-checked="false" data-i18n
                  title="Show mastered, beaten and events together">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
          </button>
          <button id="beatenonly" class="rawinsw" type="button" role="switch"
                  aria-checked="false" hidden data-i18n
                  title="Leave out the ones I went on to master">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
        </span>
        <!-- A glyph like the switches beside it. The words are on the
             tooltip, where they cost nothing. -->
        <button id="awardreset" class="rawinsw rawinreset" hidden data-i18n
                title="Put the awards back in the order they came in"
                aria-label="Reset order">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4h-4"/></svg>
        </button>
      </div>
      <div id="awards" class="rawinawards"></div>
      <div class="cartactions" id="awardmorerow" hidden>
        <button id="awardmore" class="ghost small" data-i18n>Show more awards</button>
      </div>
    </section>

    <section class="rawinsec" data-sec="following">
      <div class="rawinsechead">
        <h2 class="sethead" data-i18n>People you follow</h2>
        <span class="rawinmove">
          <!-- Left and right only appear once there is more than one column
               to move between - see paintCols. In a column layout the blocks
               flow, so "left" is a step earlier in the order and "right" a
               step later; they are the same two moves the arrows beside them
               make, named for what they look like they do. -->
          <button class="ghost small rawinside" data-move="-1" data-i18n title="Move left" aria-label="Move left">&#9664;</button>
          <button class="ghost small" data-move="-1" data-i18n title="Move up" aria-label="Move up">&#9650;</button>
          <button class="ghost small" data-move="1" data-i18n title="Move down" aria-label="Move down">&#9660;</button>
          <button class="ghost small rawinside" data-move="1" data-i18n title="Move right" aria-label="Move right">&#9654;</button>
        </span>
      </div>
      <!-- Ordered by who was last at it. There was a choice here between that
           and points, and points is now the ranking below - which does the
           job properly, over three windows. -->
      <div id="following" class="rawinlist"></div>
    </section>

    <!-- Who is ahead. Today first: it is the one that changes, and the one
         somebody opens this to see. All time is the points they already
         carry; the two windows are counted from what each of them earned, a
         request per person, so they are asked for rather than fetched with
         the page.
         Its own block rather than a tail on the one above, so it can be moved
         like everything else here - it was the only piece of this page that
         could not be. -->
    <section class="rawinsec" data-sec="ranking">
      <div class="rawinsechead">
        <h2 class="sethead" data-i18n>Followed users ranking</h2>
        <span class="rawinmove">
          <!-- Left and right only appear once there is more than one column
               to move between - see paintCols. In a column layout the blocks
               flow, so "left" is a step earlier in the order and "right" a
               step later; they are the same two moves the arrows beside them
               make, named for what they look like they do. -->
          <button class="ghost small rawinside" data-move="-1" data-i18n title="Move left" aria-label="Move left">&#9664;</button>
          <button class="ghost small" data-move="-1" data-i18n title="Move up" aria-label="Move up">&#9650;</button>
          <button class="ghost small" data-move="1" data-i18n title="Move down" aria-label="Move down">&#9660;</button>
          <button class="ghost small rawinside" data-move="1" data-i18n title="Move right" aria-label="Move right">&#9654;</button>
        </span>
      </div>
      <div class="rawintabs" id="ranktabs">
        <button class="rawintab on" data-window="day" data-i18n>Today</button>
        <button class="rawintab" data-window="week" data-i18n>This week</button>
        <button class="rawintab" data-window="all" data-i18n>All time</button>
      </div>
      <div id="ranking" class="rawinlist rawinrank"></div>
      <!-- How many people you follow have not played in this window. Said
           rather than shown as a row of zeroes. -->
      <p class="accthint" id="rankquiet" hidden></p>
    </section>
  </div>

  <p class="accthint" id="note"></p>

  <!-- Right-clicking anything with a game behind it: their page, the files
       their set accepts, and this app's own achievement list - which opens in
       the app rather than here, since that is where it lives. -->
  <div id="gamemenu" class="libmenu" hidden>
    <button data-act="ra" data-i18n>Open on RetroAchievements</button>
    <button data-act="howlong" data-i18n>How Long / Achievements</button>
    <button data-act="hashes" data-i18n>Patches &amp; supported files</button>
  </div>

  <script src="/i18n.js"></script>
  <!-- The badge wall is drawn the same way here as in the app's own list. -->
  <script src="/achshared.js"></script>
  <script src="/raprofile.js"></script>
</body>
</html>
